# Runs untrusted fork code: keep it on `pull_request` (never `pull_request_target`),
# read-only token, no secrets, actions pinned to commit SHAs. Only the publish job
# gets `id-token: write`, and only on pushes to main through the `npm` environment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install AlgoKit
        run: pipx install algokit==2.10.2

      - name: Install dependencies
        working-directory: projects/puya-ts-utils
        run: pnpm install --frozen-lockfile

      - name: Build
        run: algokit project run build

      - name: Check TEAL artifacts are up to date
        run: algokit project run ci-teal-diff

      - name: Start LocalNet
        run: algokit localnet start

      - name: Test
        run: algokit project run test

      # Decided here, outside the `npm` environment, so pushes that don't bump
      # the version never ask for a publish approval.
      - name: Check whether this version needs publishing
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: projects/puya-ts-utils
        run: |
          spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already on npm, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: test
    if: needs.test.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN
    defaults:
      run:
        working-directory: projects/puya-ts-utils
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      # Node 24 ships an npm with trusted publishing (>= 11.5.1).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # `prepublishOnly` runs the full contract build.
      - name: Install AlgoKit
        run: pipx install algokit==2.10.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the packed package
        run: pnpm run test:pack

      - name: Publish
        run: npm publish
