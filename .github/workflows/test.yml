# Runs untrusted fork code: keep it on `pull_request` (never `pull_request_target`),
# read-only token, no secrets, actions pinned to commit SHAs.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install AlgoKit
        run: pipx install algokit==2.10.2

      - name: Install dependencies
        working-directory: projects/puya-ts-utils
        run: pnpm install --frozen-lockfile

      - name: Build
        run: algokit project run build

      - name: Check TEAL artifacts are up to date
        run: algokit project run ci-teal-diff

      - name: Start LocalNet
        run: algokit localnet start

      - name: Test
        run: algokit project run test
